<g class="l0"><text x="16" y="54" fill="#7ee787">$</text><text x="32.8" y="54" fill="#f0f6fc" textLength="420.0">satchel add https://en.wikipedia.org/wiki/Link_rot</text><rect class="c0" x="32.8" y="40" width="428.4" height="19" fill="#0d1117"/></g>
<text class="l1" x="16" y="73" fill="#c9d1d9" textLength="252.0" xml:space="preserve">saved #1: Link rot - Wikipedia</text>
<g class="l3"><text x="16" y="111" fill="#7ee787">$</text><text x="32.8" y="111" fill="#f0f6fc" textLength="579.6">satchel add https://jvns.ca/blog/2016/10/10/what-even-is-a-container/</text><rect class="c3" x="32.8" y="97" width="588.0" height="19" fill="#0d1117"/></g>
<text class="l4" x="16" y="130" fill="#c9d1d9" textLength="487.2" xml:space="preserve">saved #2: What even is a container: namespaces and cgroups</text>
<g class="l6"><text x="16" y="168" fill="#7ee787"></text><text x="32.8" y="168" fill="#8b949e" textLength="495.6"># offline, a year later, the link is dead -- the text isn&#x27;t</text><rect class="c6" x="32.8" y="154" width="504.0" height="19" fill="#0d1117"/></g>
<g class="l8"><text x="16" y="206" fill="#7ee787">$</text><text x="32.8" y="206" fill="#f0f6fc" textLength="184.8">satchel search wayback</text><rect class="c8" x="32.8" y="192" width="193.2" height="19" fill="#0d1117"/></g>
<text class="l9" x="16" y="225" fill="#8b949e" textLength="571.2" xml:space="preserve">#1    Link rot - Wikipedia  (https://en.wikipedia.org/wiki/Link_rot)</text>
<g class="l11"><text x="16" y="263" fill="#7ee787">$</text><text x="32.8" y="263" fill="#f0f6fc" textLength="201.6">satchel read 1 | head -4</text><rect class="c11" x="32.8" y="249" width="210.0" height="19" fill="#0d1117"/></g>
<text class="l12" x="16" y="282" fill="#c9d1d9" textLength="168.0" xml:space="preserve">Link rot - Wikipedia</text>
<text class="l14" x="16" y="320" fill="#c9d1d9" textLength="67.2" xml:space="preserve">Link rot</text>
<text class="l15" x="16" y="339" fill="#c9d1d9" textLength="730.8" xml:space="preserve">Link rot (also called link death, link breaking, or reference rot) is the phenomenon of</text>
<text class="l16" x="16" y="358" fill="#c9d1d9" textLength="756.0" xml:space="preserve">     hyperlinks tending over time to cease to point to their originally targeted file, web</text>
<text class="l17" x="16" y="377" fill="#c9d1d9" textLength="722.4" xml:space="preserve">     page, or server due to that resource being relocated to a new address or becoming</text>
<text class="l18" x="16" y="396" fill="#c9d1d9" textLength="756.0" xml:space="preserve">     permanently unavailable. A link that no longer resolves at the intended target may be</text>
<text class="l19" x="16" y="415" fill="#c9d1d9" textLength="730.8" xml:space="preserve">     called broken or dead. Link rot can be avoided by designing stable and clean URLs,</text>
<text class="l20" x="16" y="434" fill="#c9d1d9" textLength="470.4" xml:space="preserve">     avoiding deep linking, and the use of web archives.</text>
</svg>