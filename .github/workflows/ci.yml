name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Covers the database (default path, migrations to a fresh parent dir,
    # FTS5 error handling), and the capture listener's critical path (a
    # real HTTPServer in a background thread, hit with real HTTP requests,
    # including SSRF attempts against it) -- see tests/test_satchel.py.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject; test the floor, not just today.
        python: ["3.10", "3.13"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python tests/test_satchel.py
      - run: python tests/test_import.py

  package:
    # Build and install the distribution on every commit, not only at
    # release -- a packaging break (missing package data, wrong entry
    # point) is invisible to `pip install -e .` and only shows up in the
    # wheel. Also exercises the installed CLI cold, with no dev checkout
    # on PYTHONPATH: --help, and a real `list` against a fresh, empty,
    # default-location database (proves the XDG default path resolves and
    # is writable for a real installed user, not just in a test fixture).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - name: Install the wheel and run it as a user would
        run: |
          set -euo pipefail
          python -m venv /tmp/v
          /tmp/v/bin/pip install --disable-pip-version-check -q dist/*.whl
          /tmp/v/bin/satchel --help > /dev/null
          /tmp/v/bin/satchel list | grep -q "nothing saved yet"
          test "$(/tmp/v/bin/python -c 'import satchel; print(satchel.__version__)')" \
             = "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
